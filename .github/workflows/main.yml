name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: kernel-tree-wip

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev

    - name: Download AOSP Clang
      run: |
        git clone --depth=1 https://github.com/llvm-mirror/llvm.git clang
        # Используем предкомпилированный LLVM/Clang окружения Ubuntu, если зеркало тяжелое,
        # либо качаем чистый Android Clang 17 с проверенного Github-репозитория:
        rm -rf clang
        git clone --depth=1 https://github.com/Panchajanya1999/azure-clang.git clang

    - name: Compile Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Генерируем .config
        make O=out lancelot_defconfig CC=clang
        
        # Собираем ядро со всеми утилитами LLVM
        make O=out LLVM=1 LLVM_IAS=1 -j$(nproc)

    - name: Upload Kernel Output
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Image
        path: out/arch/arm64/boot/Image.gz-dtb
