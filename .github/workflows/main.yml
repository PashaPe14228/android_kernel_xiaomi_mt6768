name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: kernel-tree-wip

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev

    - name: Download AOSP Clang
      run: |
        git clone --depth=1 https://github.com/Panchajanya1999/azure-clang.git clang

    - name: Compile Kernel
      run: |
        # Прописываем путь к компилятору
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        
        # Жестко фиксируем глобальные переменные окружения для кросс-компиляции
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export HOSTCC=gcc
        export HOSTCXX=g++
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        # Очищаем старые следы неудачных конфигураций во избежание конфликтов
        make O=out clean
        make O=out mrproper

        # 1. Генерируем .config
        make O=out lancelot_defconfig
        
        # 2. Запускаем сборку ядра (теперь все переменные подхватятся из export автоматически)
        make O=out -j$(nproc)

    - name: Upload Kernel Output
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Image
        path: out/arch/arm64/boot/Image.gz-dtb
        
