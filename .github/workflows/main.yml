name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: kernel-tree-wip

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev

    - name: Download AOSP Clang
      run: |
        git clone --depth=1 https://github.com/Panchajanya1999/azure-clang.git clang

    - name: Compile Kernel
      run: |
        # Добавляем бинарники Clang в PATH
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        
        # Задаем базовые параметры архитектуры
        export ARCH=arm64
        export SUBARCH=arm64

        # Очищаем кэш и старые конфиги, принудительно используя хостовый GCC
        make O=out ARCH=arm64 SUBARCH=arm64 HOSTCC=gcc HOSTCXX=g++ clean
        make O=out ARCH=arm64 SUBARCH=arm64 HOSTCC=gcc HOSTCXX=g++ mrproper

        # 1. Генерируем .config. Передаем HOSTCC/HOSTCXX прямо в команду, чтобы fixdep собрался через GCC
        make O=out ARCH=arm64 SUBARCH=arm64 lancelot_defconfig HOSTCC=gcc HOSTCXX=g++ CC=clang

        # 2. Запускаем компиляцию ядра. Передаем абсолютно все инструменты LLVM вручную в строку вызова
        make O=out \
          ARCH=arm64 \
          SUBARCH=arm64 \
          HOSTCC=gcc \
          HOSTCXX=g++ \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          -j$(nproc)

    - name: Upload Kernel Output
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Image
        path: out/arch/arm64/boot/Image.gz-dtb
        
